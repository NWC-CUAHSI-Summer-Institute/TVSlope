# Base conda environment for the four notebooks (gauge_study, study_area, timevary_slope, work6_3DHRS).
# Create with:  conda env create -f environment.yml   &&   conda activate slope
#
# These packages reproduce the cached figures (work6_3DHRS). Three HAND-FIM tools from the SDML lab
# (https://github.com/sdmlua) are installed separately with pip (kept out of the conda solve to avoid
# geopandas/rasterio conflicts) -- see the README:
#     pip install fimeval        # download FIMBench benchmarks   (gauge_study / study_area)
#     pip install fimserve       # HAND-FIM staging/serving        (FIM regeneration)
#     pip install "git+https://github.com/sdmlua/fimbox"   # HAND-FIM generation (REGEN_FIM / TVS_REGEN)
name: slope
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=2.0
  - pandas=2.3
  - geopandas=1.1
  - pyogrio=0.12
  - rasterio=1.4
  - shapely=2.1
  - affine=2.4
  - scipy=1.15
  - scikit-learn=1.7
  - matplotlib=3.10
  - contextily=1.7
  - xyzservices
  - dataretrieval=1.1
  - openpyxl=3.1
  - jupyter
  - pip
